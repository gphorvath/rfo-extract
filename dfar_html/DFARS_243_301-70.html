<body><h2>243.301-70 Treatment of certain clauses implementing Executive orders.</h2>
<div class="body conbody"><p class="p">When issuing a unilateral change to a contract, delivery order, or task order necessary to implement an Executive order, follow the procedures at FAR subpart 43.3 (10 U.S.C. 3862(c)).</p></div>
