<body><h2>240.7008-1 Definition.</h2>
<div class="body conbody"><p class="p">As used in this section—</p>
<p class="p"><em>Covered foreign country</em> means any of the following:</p>
<p class="p">(1)  The People’s Republic of China.</p>
<p class="p">(2)  The Russian Federation.</p>
<p class="p">(3)  The Islamic Republic of Iran.</p>
<p class="p">(4)  The Democratic People’s Republic of Korea.</p></div>
