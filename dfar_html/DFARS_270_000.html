<body><h2>270.000 Scope of part.</h2>
<div class="body conbody"><p class="p">This part contains DFARS coverage of defense-specific contracting programs that do not properly fall under DFARS subchapter D, Socioeconomic Programs, and neither implement nor supplement existing FAR part 19 or parts 22 through 26.</p></div>
