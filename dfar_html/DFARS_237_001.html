<body><h2>237.001 Definition.</h2>
<div class="body conbody"><p class="p">As used in this subpart—</p>
<p class="p"><em>Nonprofit organization</em> means any organization that is—</p>
<p class="p">(1)  Described in section 501(c) of the Internal Revenue Code of 1986 (26 U.S.C. 501); and</p>
<p class="p">(2)  Exempt from tax under 26 U.S.C. 501(a).</p></div>
