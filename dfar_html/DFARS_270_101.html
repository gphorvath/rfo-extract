<body><h2>270.101 Definition.</h2>
<div class="body conbody"><p class="p">As used in this subpart—</p>
<p class="p"><em>Qualified business</em> means an S corporation as defined in 26 U.S.C. 1361(a)(1) for which 100 percent of the outstanding stock is held through an employee stock ownership plan as defined in 26 U.S.C. 4975(e)(7).</p></div>
