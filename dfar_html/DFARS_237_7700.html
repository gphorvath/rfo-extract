<body><h2>237.7700 Scope of subpart.</h2>
<div class="body conbody"><p class="p">This subpart implements section 898 of the NDAA for FY 2016 (Pub. L. 114-92) for the acquisition of religious-related services to be performed on a U.S. military installation.</p></div>
