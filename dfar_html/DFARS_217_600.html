<body><h2>217.600 Scope of subpart.</h2>
<div class="body conbody"><p class="p">This subpart implements section 854 of the National Defense Authorization Act (NDAA) for Fiscal Year (FY) 2005 (Pub. L. 108-375), section 801 of the NDAA for FY 2008 (Pub. L. 110-181, and section 806 of the NDAA for FY 2010 (Pub. L. 111-84).</p></div>
