<body><h2>217.502-70 Written agreement on responsibility for management and administration.</h2>
<div class="body conbody"><p class="p">For assisted acquisitions, follow the procedures at PGI 217.502-70, when a contracting activity from a DoD component provides acquisition assistance to deployed DoD units or personnel from another DoD component.</p></div>
