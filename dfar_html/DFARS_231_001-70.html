<body><h2>231.001-70 Applicability.</h2>
<div class="body conbody"><p class="p">Do not apply part 231 or FAR part 31 to contracts with nontraditional defense contractors (section 1826(a)(10) of the National Defense Authorization Act for Fiscal Year 2026, Pub. L. 119-60).</p></div>
