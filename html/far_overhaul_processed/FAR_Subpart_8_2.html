                <h2>Subpart 8.2 - Acquisition From AbilityOne Participating Nonprofit Agencies</h2>
<div class="body"><p class="p">When buying supplies or services from AbilityOne Nonprofit Agencies, agencies must follow the requirements of this subpart and 41 CFR chapter 51.</p></div>
